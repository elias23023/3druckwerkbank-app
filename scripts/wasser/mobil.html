<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wasser-Look: Vorlage Mobil</title>
<!--
  The mobile template to look at: a faithful mock of the mobile screen (src/mobile/Mobile.tsx) that loads the REAL app
  stylesheets from src/ and, on top, the water look from docs/wasser-look/vorlage. Nothing of the app is changed.
  Serve the repository root and open this page at phone width:
      python3 -m http.server 4310          ->  http://localhost:4310/scripts/wasser/mobil.html
      npm run dev                          ->  http://localhost:5173/scripts/wasser/mobil.html
  Query:  ?ton=klar            the light mode (sets data-wa-ton on <html>; no parameter = dunkel)
          ?scene=start|heute|projekte|material|druck|wetter|archiv|innen     the painted scene behind
          ?nah=1               close-up of the buttons (use a wide window)
          ?alles=1             a bottom sheet with every small building block, and a toast
          ?fallback=1          without WebGL (plain glass buttons)
          ?ohne=1              the app as it is today, without the look
          ?alt=<folder>        an earlier state of the look instead (a folder with look.css and look.js, path from the
                               repository root, e.g. docs/wasser-look/entwurf/nachgebessert): what vergleich.mjs compares with
          ?schlaf=<ms>         the water rests after this time (default 30000)      ?w3flat=1 ?w3prof=1 ?w3noderiv=1  test aids
  Tapping a tab moves class "on" and swaps the scene image like the real app.
-->
<!-- real app styles, unchanged -->
<link rel="stylesheet" href="../../node_modules/@fontsource/inter/latin-400.css"><link rel="stylesheet" href="../../node_modules/@fontsource/inter/latin-500.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/inter/latin-600.css"><link rel="stylesheet" href="../../node_modules/@fontsource/inter/latin-700.css">
<link rel="stylesheet" href="../../src/styles/tokens.css"><link rel="stylesheet" href="../../src/styles/global.css"><link rel="stylesheet" href="../../src/mobile/mobile.css">
<style>
  /* this page only (not part of the look) */
  .m-card { animation: none !important; }
  .frei { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .frei .btn--icon, .nahbox .btn--icon { padding: 0; width: 40px; height: 40px; }
  .frei .btn--icon svg, .nahbox .btn--icon svg { width: 18px; height: 18px; }
  .lbl { font-size: 11px; color: rgba(244,246,251,.7); text-shadow: 0 1px 6px rgba(0,0,0,.7); letter-spacing: .04em; text-transform: uppercase; }
  body.nah .m-head, body.nah .m-tabs, body.nah .m-main > *:not(.nahbox) { display: none; }
  body:not(.nah) .nahbox { display: none; }
  body.nah .m-main { padding: 0; justify-content: center; align-items: center; overflow: hidden; }
  .nahbox { zoom: 2.6; display: flex; flex-direction: column; gap: 14px; align-items: center; width: 330px; }
  .nahbox .frei { justify-content: center; }
  .nahbox .m-card { width: 100%; }
</style>
</head><body>
<div class="m-shell" data-look="tag" data-wasser="mobil">
  <div class="m-bg" aria-hidden="true"><img id="scene" alt=""></div>
  <header class="m-head">
    <button class="brand"><svg class="brand__logo" width="30" height="30" viewBox="0 0 64 64"><defs><linearGradient id="lgo" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#9fd0ff"/><stop offset="1" stop-color="#3b7fd6"/></linearGradient></defs><path d="M32 4 58 18v28L32 60 6 46V18z" fill="url(#lgo)" opacity=".9"/><path d="M32 12 50 22v20L32 52 14 42V22z" fill="none" stroke="#fff" stroke-width="2.5" opacity=".9"/><path d="M32 12v40M14 22l18 10 18-10" fill="none" stroke="#fff" stroke-width="2" opacity=".6"/></svg><div><b>3Druckwerkbank</b><span class="ws-chip ws-chip--echt ws-chip--mini" role="button"><i class="dot"></i>Meine Werkstatt</span></div></button>
    <span class="spacer"></span>
    <button class="glass m-ico" aria-label="Suche"><svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.3-4.3"/></svg></button>
    <button class="glass m-ico" aria-label="Hinweise"><svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><span class="badge">2</span></button>
    <button class="glass m-ico" aria-label="Konto"><svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg></button>
  </header>
  <main class="m-main">
    <div class="m-clock"><b>17:42</b><span>Donnerstag, 12. November</span><p class="q">Aus Ideen entstehen Lieblingsstücke.</p></div>
    <!-- buttons directly over the painted scene -->
    <div class="frei"><button class="btn btn--primary">Projekt öffnen <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button><button class="btn">Bearbeiten</button><button class="btn btn--icon" aria-label="Neu"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button></div>
    <!-- buttons on a card, as in most of the app -->
    <section class="glass m-card"><h3><svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 4h12l-2 4 2 4H5"/></svg>Projekte<span class="cnt xs muted">8 aktiv</span><button class="btn btn--icon" aria-label="Neues Projekt"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button></h3>
      <div class="m-row m-row--click"><div class="col grow" style="gap:1px;min-width:0"><b class="ellipsis">Leiste für Kühlschrank</b><span class="xs muted">Planung · PETG · 2 h 10 min</span></div><span class="pill pill--on">Planung</span></div>
      <div class="m-row m-row--click"><div class="col grow" style="gap:1px;min-width:0"><b class="ellipsis">Träger für Gartenbox</b><span class="xs muted">Druck läuft · 64 %</span></div><span class="pill pill--ok">Druck</span></div>
      <div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn btn--primary">Projekt öffnen</button><button class="btn">Bearbeiten</button><button class="btn btn--sm">Foto</button><button class="btn btn--sm btn--ghost">Mehr</button></div>
    </section>
    <section class="glass m-card"><h3><svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 4 9 5-9 5-9-5z"/><path d="m3 14 9 5 9-5"/></svg>Material<span class="cnt xs muted">3 Rollen</span></h3>
      <div class="m-grid2"><div class="m-stat"><b>1,8 kg</b><span>verfügbar</span></div><div class="m-stat"><b>240 g</b><span>reserviert</span></div></div>
      <div class="row" style="gap:8px"><button class="btn">Verbrauch buchen</button><button class="btn btn--danger btn--sm">Löschen</button></div>
    </section>
    <!-- close-up (only with ?nah=1) -->
    <div class="nahbox">
      <span class="lbl">frei über der Szene</span>
      <div class="frei"><button class="btn btn--primary">Projekt öffnen <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button><button class="btn">Bearbeiten</button><button class="btn btn--icon" aria-label="Neu"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button></div>
      <span class="lbl">auf einer Karte</span>
      <section class="glass m-card"><div class="row" style="gap:8px;flex-wrap:wrap;justify-content:center"><button class="btn btn--primary">Projekt öffnen</button><button class="btn">Bearbeiten</button><button class="btn btn--icon" aria-label="Neu"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button></div></section>
    </div>
  </main>
  <nav class="glass glass--strong m-tabs" aria-label="Bereiche">
    <button class="on" aria-current="page"><svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg><span>Start</span></button>
    <button><svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg><span>Heute</span></button>
    <button><svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 4h12l-2 4 2 4H5"/></svg><span>Projekte</span></button>
    <button><svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 4 9 5-9 5-9-5z"/><path d="m3 14 9 5 9-5"/></svg><span>Material</span></button>
    <button><svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span>Mehr</span></button>
  </nav>
</div>
<script>
  const q = new URLSearchParams(location.search); const scene = q.get('scene') || 'start';
  const ROOT = '../../';                                           // the repository root, seen from this page
  const VORLAGE = ROOT + 'docs/wasser-look/vorlage/';
  // the scene image: public/img when the repository root is served as files, /img under the vite dev server
  const sceneSrc = (img, name) => { img.onerror = () => { img.onerror = null; img.src = `/img/szene-${name}-1280.webp`; }; img.src = `${ROOT}public/img/szene-${name}-1280.webp`; };
  sceneSrc(document.getElementById('scene'), scene);
  if (q.get('nah')) document.body.classList.add('nah');
  if (q.get('ton')) document.documentElement.dataset.waTon = q.get('ton');   // the tone: data-wa-ton on <html> (no parameter = dunkel)
  // the tab bar behaves like the real app (React): the tapped tab gets class "on" + aria-current="page", the old one loses both,
  // and the scene <img> is REPLACED by a new element (the app renders <img key={scene}>), order of scenes as in the app
  const TAB_SCENE = ['start', 'heute', 'projekte', 'material', 'druck'];
  document.querySelectorAll('.m-tabs button').forEach((b, i) => b.addEventListener('click', () => {
    document.querySelectorAll('.m-tabs button').forEach((x) => { x.classList.toggle('on', x === b); if (x === b) x.setAttribute('aria-current', 'page'); else x.removeAttribute('aria-current'); });
    const old = document.querySelector('.m-bg img'); const img = document.createElement('img'); img.alt = ''; sceneSrc(img, TAB_SCENE[i]); old.replaceWith(img);
  }));
  const css = (href) => new Promise((ok) => { const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = href; l.onload = ok; l.onerror = ok; document.head.appendChild(l); });
  const js = (src) => new Promise((ok) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = ok; document.body.appendChild(s); });
  (async () => {
    if (q.get('alt')) {                                            // an earlier state of the look (its rules start with .m-shell, its script starts itself)
      const alt = /^(https?:)?\//.test(q.get('alt')) ? q.get('alt') : ROOT + q.get('alt');
      await css(`${alt}/look.css`); await js(`${alt}/look.js`);
    } else if (!q.get('ohne')) {                                   // the template: three stylesheets in this order, then the script
      await css(VORLAGE + 'kern.css'); await css(VORLAGE + 'mobil.css'); await css(VORLAGE + 'desktop.css');
      await js(VORLAGE + 'wasser.js');
      if (window.Wasser) window.Wasser.start({                     // the mobile defaults; the query only adds test aids
        webgl: !q.get('fallback'),
        sleep: q.get('schlaf') ? +q.get('schlaf') : undefined,
        debug: { flat: !!q.get('w3flat'), prof: !!q.get('w3prof'), noDeriv: !!q.get('w3noderiv') },
      });
    }
    await document.fonts.ready; await document.querySelector('.m-bg img').decode().catch(() => {});
    requestAnimationFrame(() => requestAnimationFrame(() => { window.__ready = true; }));
  })();
</script>
</body></html>
